[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-trading-research-pipeline"
version = "0.1.0"
description = "Statistical arbitrage research pipeline: cointegration screening, z-score signals and a cost-aware backtest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Niraj Namburi" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "matplotlib>=3.7",
    "pyarrow>=14",
]

[project.optional-dependencies]
# ruff is pinned exactly: CI gates on `ruff format --check`, and formatter style changes
# between ruff minor releases would otherwise turn CI red with no code change.
dev = ["pytest>=7", "ruff==0.16.7"]

[project.scripts]
pairs-trading = "pairs_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
