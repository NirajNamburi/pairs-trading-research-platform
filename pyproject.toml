[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-trading-research-platform"
version = "0.1.0"
description = "Pairs trading research platform: unit-root pretest, Engle-Granger screen, z-score signals, cost-aware backtest and a Streamlit viewer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Niraj Namburi" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "matplotlib>=3.7",
    "pyarrow>=14",
]

[project.optional-dependencies]
# ruff is pinned exactly: CI gates on `ruff format --check`, and formatter style changes
# between ruff minor releases would otherwise turn CI red with no code change.
dev = ["pytest>=7", "ruff==0.16.7"]
# Only needed to (re)build a universe with `python -m pairs_trading.universe_selection`.
universe = ["requests>=2.31", "lxml>=5"]
# The Streamlit research viewer: `python -m pairs_trading.ui`. 1.51 is the first release where
# both st.dataframe and st.plotly_chart accept width="stretch".
ui = ["streamlit>=1.51", "plotly>=5"]

[project.scripts]
pairs-trading = "pairs_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pairs_trading = ["universes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
